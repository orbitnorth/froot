<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{doc_title}} — Froot Framework Documentation</title>
  <meta name="description" content="{{doc_summary}}">
  <meta name="theme-color" content="#090d16">

  <!-- OpenGraph -->
  <meta property="og:title" content="{{doc_title}} — Froot Framework Documentation">
  <meta property="og:description" content="{{doc_summary}}">
  <meta property="og:type" content="article">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            froot: {
              50: '#ecfdf5',
              100: '#d1fae5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              900: '#064e3b',
            },
            dark: {
              800: '#0f172a',
              900: '#090d16',
              950: '#050811',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles.css">
  <style>
    pre code {
      display: block;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .prose h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 2.25rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #1e293b;
    }
    .prose h3 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-top: 1.75rem;
      margin-bottom: 0.5rem;
    }
    .prose p {
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
      line-height: 1.7;
      color: #94a3b8;
    }
    .prose ul, .prose ol {
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
      padding-left: 1.5rem;
      color: #cbd5e1;
    }
    .prose li {
      margin-top: 0.25rem;
      margin-bottom: 0.25rem;
    }
    .prose code:not(pre code) {
      background: #0f172a;
      color: #34d399;
      padding: 0.15rem 0.4rem;
      border-radius: 0.375rem;
      font-size: 0.825rem;
      border: 1px solid #1e293b;
      font-family: 'JetBrains Mono', monospace;
    }
    .prose a {
      color: #34d399;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .prose a:hover {
      color: #6ee7b7;
    }
    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.25rem;
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
    }
    .prose th {
      background: #0f172a;
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      color: #e2e8f0;
      border: 1px solid #1e293b;
    }
    .prose td {
      padding: 0.75rem 1rem;
      border: 1px solid #1e293b;
      color: #94a3b8;
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 font-sans antialiased selection:bg-emerald-500/20 selection:text-emerald-300 min-h-screen">

  <div class="flex min-h-screen">

    <!-- Mobile Drawer Overlay -->
    <div id="docs-backdrop" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden" onclick="toggleDocsSidebar()"></div>

    <!-- LEFT SIDEBAR: NO NAVBAR on Docs! All navigation lives here in the left sidebar -->
    <aside id="docs-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 lg:w-80 bg-[#070b13] border-r border-slate-800 flex flex-col transition-transform -translate-x-full md:translate-x-0">
      
      <!-- Sidebar Header & Back to Landing Link -->
      <div class="p-5 border-b border-slate-800/80 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2.5 group">
          <span class="text-2xl transition-transform group-hover:scale-110">🍏</span>
          <div>
            <div class="text-base font-bold text-white tracking-tight flex items-center gap-2">
              <span>Froot<span class="text-emerald-400">.ts</span></span>
              <span class="text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-1.5 py-0.2 rounded-full">DOCS</span>
            </div>
            <span class="text-xs text-slate-400 group-hover:text-emerald-400 flex items-center gap-1 transition-colors mt-0.5">
              <span>&larr; Back to Landing Page</span>
            </span>
          </div>
        </a>

        <!-- Mobile Close Button -->
        <button class="md:hidden text-slate-400 hover:text-white p-1" onclick="toggleDocsSidebar()">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Quick Search Filter -->
      <div class="p-3 border-b border-slate-800/60">
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3 top-2.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input
            id="docs-search-input"
            type="text"
            placeholder="Filter documentation topics..."
            oninput="filterDocsNav(this.value)"
            class="w-full bg-slate-900/90 text-xs text-slate-200 placeholder-slate-500 pl-9 pr-3 py-2 rounded-lg border border-slate-800 focus:outline-none focus:border-emerald-500/60 transition-colors"
          />
        </div>
      </div>

      <!-- Left Navigation Tree -->
      <nav class="flex-1 overflow-y-auto p-4 space-y-6" id="docs-nav-tree">
        {{sidebar_links}}
      </nav>

      <!-- Sidebar Footer Links -->
      <div class="p-4 border-t border-slate-800/80 bg-[#050811]/60 flex items-center justify-between text-xs text-slate-400">
        <a href="/llms.txt" class="hover:text-emerald-400 transition-colors font-mono">llms.txt</a>
        <a href="https://github.com/orbitnorth/froot" target="_blank" rel="noreferrer" class="hover:text-emerald-400 transition-colors">GitHub</a>
        <a href="https://www.npmjs.com/package/frootjs" target="_blank" rel="noreferrer" class="hover:text-emerald-400 transition-colors">npm</a>
      </div>
    </aside>

    <!-- RIGHT MAIN CONTENT AREA -->
    <div class="flex-1 min-w-0 md:ml-72 lg:ml-80 flex flex-col min-h-screen">

      <!-- Mobile Top Bar (Only visible on small viewports when sidebar is collapsed) -->
      <div class="md:hidden sticky top-0 z-30 bg-[#090d16]/90 backdrop-blur-md border-b border-slate-800 p-3.5 flex items-center justify-between">
        <button class="flex items-center gap-2 text-slate-300 hover:text-white" onclick="toggleDocsSidebar()">
          <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <span class="text-xs font-semibold">Docs Navigation</span>
        </button>

        <a href="/" class="text-xs text-slate-400 hover:text-emerald-400 flex items-center gap-1">
          <span>&larr; Landing Page</span>
        </a>
      </div>

      <!-- Main Document Body -->
      <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-10 lg:px-12">

        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-slate-400 mb-6 font-mono" aria-label="Breadcrumb">
          <a href="/docs" class="hover:text-emerald-400 transition-colors">Docs</a>
          <span>/</span>
          <span class="text-slate-400">{{doc_category}}</span>
          <span>/</span>
          <span class="text-emerald-400 font-medium">{{doc_title}}</span>
        </nav>

        <!-- Document Header -->
        <header class="mb-10 pb-6 border-b border-slate-800">
          <div class="inline-block text-[11px] font-mono uppercase tracking-wider text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-md mb-3">
            {{doc_category}}
          </div>
          <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-3">
            {{doc_title}}
          </h1>
          <p class="text-base text-slate-300 leading-relaxed">{{doc_summary}}</p>
        </header>

        <!-- Document Content -->
        <article class="prose max-w-none text-slate-300">
          {{doc_content}}
        </article>

        <!-- Previous / Next Navigation Cards -->
        <div class="mt-16 pt-8 border-t border-slate-800/80">
          {{pagination}}
        </div>

      </main>

      <!-- Minimal Docs Footer -->
      <footer class="mt-auto border-t border-slate-800/60 py-6 px-6 text-center text-xs text-slate-400">
        <p>Froot Framework Documentation &bull; Built with Froot SSG Engine &bull; <a href="/llms.txt" class="text-emerald-400 hover:underline">llms.txt</a></p>
      </footer>
    </div>

  </div>

  <script>
    function toggleDocsSidebar() {
      const sidebar = document.getElementById('docs-sidebar');
      const backdrop = document.getElementById('docs-backdrop');
      if (sidebar && backdrop) {
        sidebar.classList.toggle('-translate-x-full');
        backdrop.classList.toggle('hidden');
      }
    }

    function filterDocsNav(query) {
      const q = (query || '').toLowerCase().trim();
      const links = document.querySelectorAll('.doc-nav-link');
      links.forEach(link => {
        const title = link.getAttribute('data-title') || '';
        const parentLi = link.closest('li');
        if (!q || title.includes(q)) {
          if (parentLi) parentLi.style.display = '';
        } else {
          if (parentLi) parentLi.style.display = 'none';
        }
      });
    }

    function copyCode(btn) {
      const pre = btn.closest('.code-card')?.querySelector('pre code');
      if (!pre) return;
      navigator.clipboard.writeText(pre.innerText).then(() => {
        const orig = btn.innerText;
        btn.innerText = 'Copied!';
        setTimeout(() => { btn.innerText = orig; }, 2000);
      });
    }
  </script>
</body>
</html>
